<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1:64 车模收藏馆 | shenjingqu.xyz</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navMount"></div>

  <main>
    <section class="hero" id="details">
      <div class="hero-copy">
        <div class="kicker">全新整理</div>
        <h1>1:64车模收藏馆</h1>
        <div class="hero-actions">
          <a class="link" href="#catalog">浏览车型</a>
          <a class="link" href="#owners">选择车库</a>
        </div>
      </div>
    </section>

    <section class="band" id="owners">
      <div class="owner-switch" id="ownerWrap" aria-label="收藏持有人"></div>
    </section>

    <section class="catalog" id="catalog">
      <div class="catalog-head">
        <h2>浏览当前车库的收藏</h2>
        <div class="catalog-tools">
          <input class="search-box" id="searchInput" type="search" placeholder="搜索车型或简介" aria-label="搜索车型或简介">
          <div class="filters" id="filterWrap" aria-label="车型分类"></div>
          <div class="filters">
            <button class="clear-btn" type="button" id="clearBtn">清空筛选</button>
            <button class="random-btn" type="button" id="randomBtn">随机车模</button>
          </div>
        </div>
      </div>
      <div class="car-grid" id="carGrid"></div>
      <div class="empty-state" id="emptyState">没有匹配的车模，换个关键词或清空筛选试试。</div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="modal-close" id="lightboxClose" type="button" aria-label="关闭">×</button>
    <img id="lightboxImg" alt="">
  </div>

  <script src="data/cars.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
