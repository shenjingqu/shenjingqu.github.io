<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1:64 车模收藏馆 | shenjingqu.xyz</title>
<style>
:root {
  --text: #1d1d1f;
  --muted: #6e6e73;
  --blue: #0066cc;
  --surface: #f5f5f7;
  --line: rgba(0, 0, 0, 0.08);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  background: #080808;
  color: var(--text);
  font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
}

button {
  font: inherit;
}

.top-nav {
  position: sticky;
  top: 0;
  z-index: 20;
  height: 44px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(248, 248, 250, 0.9);
  backdrop-filter: saturate(180%) blur(18px);
}

.nav-inner {
  width: min(1024px, calc(100% - 32px));
  height: 100%;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: rgba(0, 0, 0, 0.78);
  font-size: 12px;
}

.brand {
  font-weight: 700;
  letter-spacing: 0;
}

.nav-links {
  display: flex;
  gap: 28px;
  list-style: none;
}

.nav-links a {
  color: inherit;
  text-decoration: none;
}

.hero {
  min-height: calc(100vh - 44px);
  display: grid;
  align-items: start;
  justify-items: center;
  overflow: hidden;
  position: relative;
  background: #050505;
  isolation: isolate;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(180deg, rgba(0, 0, 0, 0.08) 0%, rgba(0, 0, 0, 0.22) 52%, rgba(0, 0, 0, 0.72) 100%),
    radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.38), transparent 31%),
    radial-gradient(ellipse at 50% 74%, rgba(130, 12, 12, 0.34), transparent 42%),
    #050505;
}

.hero::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 34%;
  z-index: -1;
  background:
    radial-gradient(ellipse at 32% 56%, rgba(255, 255, 255, 0.22), transparent 32%),
    radial-gradient(ellipse at 68% 60%, rgba(255, 255, 255, 0.18), transparent 34%),
    linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.7));
  filter: blur(18px);
  opacity: 0.78;
}

.hero-bg {
  position: absolute;
  inset: 0;
  z-index: -3;
  background:
    linear-gradient(90deg, rgba(0, 0, 0, 0.94), transparent 28%, transparent 72%, rgba(0, 0, 0, 0.94)),
    radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.16), transparent 38%),
    #020202;
}

.hero-stage {
  position: absolute;
  left: 50%;
  bottom: clamp(-18px, 0vh, 0px);
  width: min(900px, 88vw);
  height: min(46vh, 430px);
  z-index: 1;
  transform: translateX(-50%);
  pointer-events: none;
}

.hero-stage::before {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 4%;
  height: 34%;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.08) 34%, transparent 68%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(0, 0, 0, 0.1));
  filter: blur(22px);
  opacity: 0.7;
}

.hero-stage::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  bottom: 10%;
  height: 22%;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.88), transparent 70%);
  filter: blur(10px);
}

.hero-car {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: min(680px, 78vw);
  transform: translateX(-50%);
  filter: drop-shadow(0 38px 46px rgba(0, 0, 0, 0.86)) drop-shadow(0 0 34px rgba(255, 40, 20, 0.2));
}

.hero-car img {
  display: block;
  width: 100%;
  height: auto;
}

.hero-copy {
  width: min(1080px, calc(100% - 36px));
  padding: clamp(34px, 5.8vh, 58px) 0 0;
  text-align: center;
  z-index: 3;
  color: #fff;
}

.kicker {
  margin-bottom: 10px;
  color: rgba(255, 255, 255, 0.9);
  font-size: clamp(16px, 2.2vw, 21px);
  font-weight: 600;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
}

.hero h1 {
  font-size: clamp(42px, 6.8vw, 78px);
  line-height: 0.96;
  font-weight: 700;
  letter-spacing: 0;
  text-shadow: 0 6px 38px rgba(0, 0, 0, 0.48);
}

.hero p {
  width: min(720px, 100%);
  margin: 20px auto 0;
  color: var(--muted);
  font-size: clamp(20px, 3vw, 28px);
  line-height: 1.22;
}

.hero-actions {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-top: 20px;
  font-size: 18px;
  font-weight: 600;
}

.link {
  color: rgba(255, 255, 255, 0.92);
  text-decoration: none;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
}

.link::after {
  content: " >";
}

.hero-product {
  width: min(1080px, 112vw);
  margin-bottom: -2vw;
  filter: drop-shadow(0 36px 52px rgba(0, 0, 0, 0.18));
}

.hero-product img {
  display: block;
  width: 100%;
  max-height: 46vh;
  object-fit: contain;
}

.section {
  padding: 14px 0 0;
  background: #fff;
}

.band {
  min-height: 500px;
  display: grid;
  align-items: center;
  justify-items: center;
  margin-top: 12px;
  padding: 62px 20px;
  text-align: center;
  background:
    radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.12), transparent 34%),
    #101010;
  color: #f5f5f7;
  overflow: hidden;
}

.band.dark {
  background: #000;
  color: #f5f5f7;
}

.band h2 {
  font-size: clamp(36px, 6vw, 64px);
  line-height: 1.04;
  font-weight: 700;
  letter-spacing: 0;
}

.band p {
  width: min(680px, 100%);
  margin: 12px auto 0;
  color: var(--muted);
  font-size: clamp(19px, 2.6vw, 27px);
  line-height: 1.25;
}

.band.dark p {
  color: #a1a1a6;
}

.owner-switch {
  width: min(1280px, 100%);
  display: grid;
  grid-template-columns: repeat(2, minmax(420px, 1fr));
  column-gap: 56px;
  row-gap: 44px;
  margin: 0 auto;
}

.owner-card {
  min-height: 176px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 18px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 18px;
  padding: 30px 34px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04)),
    radial-gradient(circle at 86% 12%, rgba(255, 255, 255, 0.22), transparent 32%),
    #161616;
  box-shadow: 0 22px 58px rgba(0, 0, 0, 0.34);
  color: #f5f5f7;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  text-align: left;
  transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
}

.owner-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 0 54%, rgba(255, 255, 255, 0.68) 55%, transparent 72%);
  transform: translateX(-42%);
  opacity: 0;
  transition: opacity 180ms ease, transform 420ms ease;
}

.owner-card::after {
  content: attr(data-index);
  align-self: start;
  justify-self: end;
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.54);
  font-size: 15px;
  font-weight: 700;
  position: relative;
  z-index: 1;
}

.owner-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 26px 60px rgba(0, 0, 0, 0.12);
}

.owner-card:hover::before {
  opacity: 1;
  transform: translateX(28%);
}

.owner-card.active {
  border-color: rgba(255, 255, 255, 0.45);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08)),
    radial-gradient(circle at 84% 10%, rgba(255, 255, 255, 0.32), transparent 36%),
    #202020;
}

.owner-copy {
  position: relative;
  z-index: 1;
}

.owner-name {
  display: block;
  font-size: clamp(30px, 3.5vw, 42px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: 0;
}

.owner-desc {
  display: block;
  margin-top: 12px;
  color: rgba(255, 255, 255, 0.58);
  font-size: 15px;
  line-height: 1.35;
}

.owner-meta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  color: rgba(255, 255, 255, 0.86);
  font-size: 14px;
  font-weight: 600;
}

.owner-meta::before {
  content: "";
  width: 26px;
  height: 1px;
  background: currentColor;
}

.catalog {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 76px 0 88px;
  color: #f5f5f7;
}

.catalog-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 26px;
}

.catalog-head h2 {
  max-width: none;
  white-space: nowrap;
  font-size: clamp(34px, 5vw, 56px);
  line-height: 1.05;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.filter-btn {
  min-height: 34px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 18px;
  padding: 0 15px;
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.72);
  cursor: pointer;
}

.filter-btn.active {
  border-color: rgba(255, 255, 255, 0.84);
  background: #f5f5f7;
  color: #111;
}

.car-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.car-card {
  min-height: 430px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 0;
  border-radius: 8px;
  padding: 28px;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04)),
    #141414;
  color: #f5f5f7;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
}

.car-card[hidden] {
  display: none;
}

.car-art {
  height: 240px;
  display: grid;
  place-items: center;
  margin: 14px -12px 0;
}

.car-art img {
  max-width: 100%;
  max-height: 230px;
  object-fit: contain;
  filter: drop-shadow(0 22px 24px rgba(0, 0, 0, 0.16));
}

.silhouette {
  width: min(310px, 94%);
  height: 106px;
  border-radius: 58px 86px 30px 30px;
  background: linear-gradient(135deg, #dadde5, #fff 52%, #9ea4b2);
  box-shadow: inset 0 -20px 28px rgba(0, 0, 0, 0.12), 0 30px 30px rgba(0, 0, 0, 0.1);
  position: relative;
}

.silhouette::before,
.silhouette::after {
  content: "";
  position: absolute;
  bottom: -20px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: radial-gradient(circle, #f5f5f7 0 24%, #202124 25% 54%, #050505 55%);
}

.silhouette::before {
  left: 48px;
}

.silhouette::after {
  right: 48px;
}

.car-tag {
  color: #bf4800;
  font-size: 13px;
  font-weight: 700;
}

.car-name {
  margin-top: 7px;
  color: #f5f5f7;
  font-size: 25px;
  line-height: 1.1;
}

.car-desc {
  margin-top: 9px;
  color: rgba(255, 255, 255, 0.58);
  font-size: 15px;
  line-height: 1.5;
}

.empty-state {
  display: none;
  min-height: 220px;
  place-items: center;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.58);
  font-size: 18px;
}

.empty-state.show {
  display: grid;
}

.detail-modal {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: rgba(0, 0, 0, 0.54);
  backdrop-filter: blur(16px);
}

.detail-modal.show {
  display: flex;
}

.modal-content {
  width: min(980px, 100%);
  max-height: calc(100vh - 56px);
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 28px;
  border-radius: 18px;
  padding: 28px;
  background: #fff;
  overflow: auto;
}

.modal-media {
  min-height: 420px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--surface);
}

.modal-media img {
  max-width: 92%;
  max-height: 390px;
  object-fit: contain;
}

.modal-info {
  align-self: center;
}

.modal-info h2 {
  margin-top: 8px;
  font-size: clamp(32px, 5vw, 52px);
  line-height: 1.02;
}

.modal-info p {
  margin-top: 18px;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.6;
}

.modal-close {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgba(232, 232, 237, 0.92);
  color: #555;
  cursor: pointer;
}

@media (max-width: 900px) {
  .nav-links {
    gap: 16px;
  }

  .owner-switch,
  .car-grid,
  .modal-content {
    grid-template-columns: 1fr;
  }

  .owner-switch {
    max-width: 620px;
    row-gap: 22px;
  }

  .catalog-head {
    display: block;
  }

  .catalog-head h2 {
    white-space: normal;
  }

  .filters {
    justify-content: flex-start;
    margin-top: 22px;
  }
}

@media (max-width: 620px) {
  .nav-links li:nth-child(n+3) {
    display: none;
  }

  .hero {
    min-height: 720px;
  }

  .hero-stage {
    bottom: -10px;
    width: 96vw;
    height: 310px;
  }

  .hero-car {
    width: 98vw;
  }

  .hero-actions {
    gap: 18px;
    font-size: 16px;
  }

  .band {
    min-height: auto;
    padding: 52px 16px;
  }

  .owner-card {
    min-height: 150px;
    grid-template-columns: 1fr auto;
    padding: 24px;
  }

  .owner-card::after {
    width: 46px;
    height: 46px;
  }

  .catalog {
    padding-top: 54px;
  }

  .car-card {
    min-height: 390px;
    padding: 22px;
  }
}
</style>
</head>

let activeOwner = "user4";
let activeType = "all";

const carGrid = document.getElementById("carGrid");
const emptyState = document.getElementById("emptyState");
const modal = document.getElementById("detailModal");
const modalMedia = document.getElementById("modalMedia");
const modalCarTag = document.getElementById("modalCarTag");
const modalCarTitle = document.getElementById("modalCarTitle");
const modalCarText = document.getElementById("modalCarText");
const closeModalBtn = document.getElementById("closeModalBtn");

function createCarArt(car) {
  if (car.img) {
    return `<img src="cars/${car.img}" alt="${car.name}" loading="lazy" decoding="async">`;
  }

  return `<div class="silhouette" aria-hidden="true"></div>`;
}

function renderCars() {
  carGrid.innerHTML = "";
  carList.forEach((car) => {
    const card = document.createElement("button");
    card.className = "car-card";
    card.type = "button";
    card.dataset.owner = car.owner;
    card.dataset.type = car.type;
    card.dataset.name = car.name;
    card.dataset.tag = car.tag;
    card.dataset.desc = car.desc;
    card.dataset.img = car.img || "";
    card.innerHTML = `
      <div>
        <span class="car-tag">${car.tag}</span>
        <h3 class="car-name">${car.name}</h3>
        <p class="car-desc">${car.desc}</p>
      </div>
      <div class="car-art">${createCarArt(car)}</div>
    `;
    carGrid.appendChild(card);
  });
  filterCars();
}

function filterCars() {
  let visibleCount = 0;
  document.querySelectorAll(".car-card").forEach((card) => {
    const ownerMatch = card.dataset.owner === activeOwner;
    const typeMatch = activeType === "all" || card.dataset.type === activeType;
    const visible = ownerMatch && typeMatch;
    card.hidden = !visible;
    if (visible) visibleCount += 1;
  });
  emptyState.classList.toggle("show", visibleCount === 0);
}

document.querySelectorAll(".owner-card").forEach((card) => {
  card.addEventListener("click", () => {
    document.querySelectorAll(".owner-card").forEach((item) => item.classList.remove("active"));
    card.classList.add("active");
    activeOwner = card.dataset.owner;
    filterCars();
    document.getElementById("catalog").scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

document.querySelectorAll(".filter-btn").forEach((button) => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach((item) => item.classList.remove("active"));
    button.classList.add("active");
    activeType = button.dataset.type;
    filterCars();
  });
});

carGrid.addEventListener("click", (event) => {
  const card = event.target.closest(".car-card");
  if (!card) return;

  modalCarTag.textContent = card.dataset.tag;
  modalCarTitle.textContent = card.dataset.name;
  modalCarText.textContent = card.dataset.desc;
  modalMedia.innerHTML = card.dataset.img
    ? `<img src="cars/${card.dataset.img}" alt="${card.dataset.name}">`
    : `<div class="silhouette" aria-hidden="true"></div>`;
  modal.classList.add("show");
  modal.setAttribute("aria-hidden", "false");
});

function closeModal() {
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden", "true");
}

closeModalBtn.addEventListener("click", closeModal);
modal.addEventListener("click", (event) => {
  if (event.target === modal) closeModal();
});
window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeModal();
});

renderCars();
</script>
